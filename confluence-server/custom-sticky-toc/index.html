<!-- barquerohr: use this to create a scrollable sticky TOC in two col section with right sidebar. Use calc(100vh) to alter TOC vertical length. Negative value = shorter, longer = 0-100px) -->

<style>
  .wiki-content .columnLayout {
    display: flex;
  }

  .wiki-content .contentLayout2 .columnLayout .cell {
    padding-left: 15px;
    padding-right: 55px;
}

  .wiki-content .columnLayout .cell.aside {          
    position: fixed;
    width: calc(20% - 10px);
    max-height: calc(100vh - 350px);
    overflow-y: auto;
    right: 0;
  }

  .toc-macro {
    font-size: 16px;
  }

  .wiki-content .columnLayout .cell:not(.aside) {
    margin-right: calc(20%);
  }

  .back-to-top-container {
    text-align: right;
    margin-top: 10px;
    padding-bottom: 20px;
  }

  .back-to-top-btn {
    display: inline-block;
    padding: 10px 20px;
    background-color: #1d1d1d;
    color: white !important;
    text-decoration: none;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    margin-right: 30px;
  }
</style>

<!-- barquerohr: back to top button, use this if you want a one-click method to go up to start of page -->

<div class="back-to-top-container">
  <a href="#" class="back-to-top-btn" onclick="scrollToTop()">Back to top</a>
</div>

<script>
  function scrollToTop() {
    AJS.$('html, body').animate({ scrollTop: 0 }, 'fast');
    return false;
  }
</script>
